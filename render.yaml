services:
  - type: web
    name: gossa-mvp-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run migrate:up && npm run bootstrap:owner && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY
        value: "2"
      - key: GOSSA_GARAGE_NAME
        value: Northside Garage
      - key: GOSSA_GARAGE_TIMEZONE
        value: UTC
      - key: GOSSA_OWNER_NAME
        value: Owner User
      - key: GOSSA_OWNER_EMAIL
        sync: false
      - key: GOSSA_OWNER_PASSWORD
        sync: false

  - type: web
    name: gossa-mvp-demo
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run migrate:up && npm run demo:reset && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: gossa-demo-db
          property: connectionString
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: TRUST_PROXY
        value: "2"

databases:
  - name: gossa-demo-db
    databaseName: gossa_demo
    plan: free
    region: oregon
